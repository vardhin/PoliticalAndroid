name: Bootstrap All2PDF

on:
  push:
    branches: [ all2pdf-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[expanded]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Expand source bundle
        run: |
          rm -rf _all2pdf_src
          mkdir _all2pdf_src
          base64 -d All2PDF-source.tgz.b64 | tar -xz -C _all2pdf_src

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Build offline document engine
        working-directory: _all2pdf_src/web
        run: |
          npm install --no-audit --no-fund
          npm run build
          rm -rf ../app/src/main/assets/web
          mkdir -p ../app/src/main/assets/web
          cp -a dist/. ../app/src/main/assets/web/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: _all2pdf_src
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp _all2pdf_src/app/build/outputs/apk/debug/app-debug.apk All2PDF-v1.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: All2PDF-debug-apk
          path: All2PDF-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish expanded source on branch
        if: success() && github.event_name == 'push'
        run: |
          cp -a _all2pdf_src /tmp/all2pdf-final
          git rm -rf .
          cp -a /tmp/all2pdf-final/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish All2PDF source [expanded]"
          git push origin HEAD:all2pdf-build
